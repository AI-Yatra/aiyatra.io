# Decap CMS — the visual editor at aiyatra.io/blog/admin.
#
# Guest-post workflow (editorial workflow + open authoring):
#   * Anyone signs in with GitHub. Without write access to the repo, Decap
#     forks it for them and saves their draft there.
#   * "In review" opens a pull request against main. Reviewers comment on the
#     PR; the author edits in Decap and the PR updates.
#   * A maintainer moves it to "Ready" and clicks Publish, which merges the PR.
#     The push to main runs .github/workflows/deploy.yml and the post goes live.
#
# Production sign-in needs the small OAuth relay in apps/blog/cms-auth/ (see
# its README). On localhost, `npm run dev` (repo root) also starts decap-server, so the
# editor works against the files on disk with no sign-in.

backend:
  name: github
  repo: AI-Yatra/aiyatra.io
  branch: main
  open_authoring: true
  auth_scope: public_repo
  # The deployed OAuth relay (apps/blog/cms-auth).
  base_url: https://aiyatra-cms-auth.aiyatra.workers.dev
  auth_endpoint: auth
  squash_merges: true
  commit_messages:
    create: 'Blog: add “{{slug}}”'
    update: 'Blog: update “{{slug}}”'
    delete: 'Blog: remove “{{slug}}”'
    uploadMedia: 'Blog: upload “{{path}}”'
    deleteMedia: 'Blog: delete “{{path}}”'
    openAuthoring: '{{message}}'

local_backend: true
publish_mode: editorial_workflow

site_url: https://aiyatra.io/blog
display_url: https://aiyatra.io/blog
logo_url: /aiyatra-logo-224.png

media_folder: apps/blog/public/images/uploads
public_folder: /blog/images/uploads

# Field names must match the schema in apps/blog/src/content.config.ts.
collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: 'Session recaps, tutorials and guest posts. New to writing here? Read the writing guide first at aiyatra.io/blog/guide (the “Writing guide” button, bottom right).'
    folder: apps/blog/src/content/blog
    create: true
    # New posts take their address from the Post URL field, which follows the title.
    slug: '{{fields.urlSlug}}'
    preview_path: '{{slug}}'
    summary: '{{title}} · {{author}} · {{date}}'
    sortable_fields: ['date', 'title', 'author', 'category']
    view_filters:
      - label: Guest posts
        field: category
        pattern: Guest post
      - label: Session recaps
        field: category
        pattern: Session recap
    # The whole page is a live, editable preview, so there is no side preview.
    editor:
      preview: false
    # Cover, title, subtitle and body make up the page itself (src/editor). All
    # the other fields live in the "Post details" drawer.
    fields:
      - { label: Cover image, name: cover, widget: ay-cover, required: false }
      - { label: Cover image description, name: coverAlt, widget: ay-line, required: false, placeholder: 'Describe the cover for screen readers and search engines' }
      - { label: Cover credit, name: coverCredit, widget: ay-line, required: false, placeholder: 'Photo credit (optional)' }
      - { label: Title, name: title, widget: ay-title, placeholder: 'Article title…' }
      - { label: Subtitle, name: subtitle, widget: ay-line, required: false, placeholder: 'Add a subtitle…' }
      - { label: Post, name: body, widget: ay-body }
      - { label: Post URL, name: urlSlug, widget: ay-slug, required: false, hint: 'Follows your title until you edit it. It can’t change after your first save.' }
      - { label: Short summary, name: excerpt, widget: text, hint: 'One or two sentences. Shown on the blog cards, in search results and in link previews.' }
      - label: Category
        name: category
        widget: select
        default: Guest post
        options: ['Guest post', 'Tutorial', 'Research notes', 'Community', 'Session recap']
      - { label: Tags, name: tags, widget: ay-tags, required: false, default: [], hint: '3–6 short topics. Press Enter after each one.' }
      - { label: Series, name: series, widget: string, required: false, hint: 'Writing several parts? Use the exact same series name on each post to link them together.' }
      - { label: Publish date, name: date, widget: datetime, default: '{{now}}', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, hint: 'Pick a future date to schedule the post. Once approved, it goes live at midnight IST on that date.' }
      - { label: Your name, name: author, widget: string, hint: 'As you would like it to appear on the post.' }
      - { label: Co-authors, name: coAuthors, widget: ay-tags, hash: false, placeholder: 'Add a name and press Enter', required: false, default: [] }
      - { label: About you, name: authorRole, widget: string, required: false, hint: 'e.g. “ML engineer at Acme · AIYatra Student Ambassador”' }
      - { label: Your link, name: authorUrl, widget: string, required: false, hint: 'LinkedIn, GitHub or personal site (full https:// URL).', pattern: ['^https?://', 'Must start with http:// or https://'] }
      - { label: Your photo, name: authorAvatar, widget: image, required: false, choose_url: true }
      - { label: SEO title, name: seoTitle, widget: string, required: false, hint: 'Replaces the title in search results and link previews. Aim for under 60 characters.' }
      - { label: SEO description, name: seoDescription, widget: text, required: false, hint: 'Replaces the short summary in search results. Aim for under 155 characters.' }
      - { label: Originally published at, name: canonicalUrl, widget: string, required: false, hint: 'Already published elsewhere? Paste that URL so search engines credit the original.', pattern: ['^https?://', 'Must start with http:// or https://'] }
      - { label: Meetup event link, name: eventUrl, widget: string, required: false, hint: 'Leave empty for guest posts (AIYatra session recaps only).', pattern: ['^https?://', 'Must start with http:// or https://'] }
      - { label: Attendees, name: attendees, widget: number, required: false, value_type: int, min: 0, hint: 'Leave empty for guest posts (AIYatra session recaps only).' }
