<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#172554">AI OS: Different Approaches Emerging Today</text><text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">Not all are full operating systems — each explores a different layer of AI-native computing</text><g font-family="Arial"><rect x="55" y="155" width="520" height="175" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/><rect x="625" y="155" width="520" height="175" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/><rect x="55" y="365" width="520" height="175" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><rect x="625" y="365" width="520" height="175" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/><g font-size="29" font-weight="700"><text x="95" y="215" fill="#1e3a8a">Rabbit OS</text><text x="665" y="215" fill="#5b21b6">Android + Gemini</text><text x="95" y="425" fill="#334155">Windows Copilot+ PCs</text><text x="665" y="425" fill="#1e3a8a">AIOS Research</text></g><g font-size="20" fill="#334155"><text x="95" y="260">Conversational, agent-led task</text><text x="95" y="289">execution across connected services.</text><text x="665" y="260">AI capabilities integrated into an</text><text x="665" y="289">existing mobile operating system.</text><text x="95" y="470">On-device AI features accelerated</text><text x="95" y="499">by dedicated NPU hardware.</text><text x="665" y="470">Research architecture for scheduling</text><text x="665" y="499">and managing LLM-based agents.</text></g><g font-size="15" font-weight="700"><text x="95" y="315" fill="#2563eb">AGENTIC PLATFORM</text><text x="665" y="315" fill="#7c3aed">AI-ENHANCED OS</text><text x="95" y="525" fill="#475569">AI-ENHANCED HARDWARE</text><text x="665" y="525" fill="#2563eb">RESEARCH PROJECT</text></g></g><text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Illustrative categories: these are different approaches, not all complete AI operating systems.</text></svg>